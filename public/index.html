<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vệ Binh Mật Khẩu - CyberSec Password Guardian (Pixel Style)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Thanh trạng thái kết nối Arduino & Logo Đối tác -->
    <div class="top-bar">
        <div class="partner-logos">
            <div class="logo-item" title="Trường THCS Nguyễn Bỉnh Khiêm">
                <img src="images/logo_nbk_pixel.png" alt="Logo THCS Nguyễn Bỉnh Khiêm" class="logo-img-pixel">
                <span class="logo-text">THCS NGUYỄN BỈNH KHIÊM</span>
            </div>
            <div class="logo-item" title="SoftLab">
                <img src="images/logo_softlab_pixel.png" alt="Logo SoftLab" class="logo-img-pixel">
                <span class="logo-text">SOFTLAB</span>
            </div>
        </div>

        <div class="brand-title">
            <img id="brandIcon" class="pixel-badge-icon" alt="" />
            <span>VỆ BINH MẬT KHẨU</span>
        </div>

        <div class="arduino-panel">
            <button id="btnWeather" class="weather-btn" title="Đổi thời tiết (Nắng, Mưa, Tuyết) hoặc nhấn phím W">
                <img id="weatherIconImg" class="pixel-icon-btn" alt="" />
                <span id="weatherLabel">Nắng</span>
            </button>
            <button id="btnFullscreen" class="btn-fullscreen" title="Bật/Tắt Toàn Màn Hình (phím F)">
                <img id="iconFs" class="pixel-icon-btn" style="width:14px;height:14px;image-rendering:pixelated;" alt="" />
                <span>TOÀN MÀN HÌNH [F]</span>
            </button>
            <span id="arduinoStatus" class="disconnected">Arduino: Đang quét...</span>
            <div class="port-select-box">
                <select id="portSelect">
                    <option value="">Chọn cổng COM...</option>
                </select>
                <button id="btnConnectPort" class="btn-connect">Kết nối</button>
            </div>
        </div>
    </div>

    <!-- Khung máy Arcade Pixel -->
    <div class="arcade-wrapper">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <div class="crt-overlay"></div>
    </div>

    <!-- Bảng điều khiển 5 nút bấm vật lý (Mô phỏng & Đèn tín hiệu) -->
    <div class="controls-dock">
        <div class="control-group">
            <span class="dock-label">4 Nút Câu Hỏi & Bắn Boss:</span>
            <div class="arcade-btn" data-key="A">
                A
                <span class="sub-text">ĐỎ</span>
            </div>
            <div class="arcade-btn" data-key="B">
                B
                <span class="sub-text">LAM</span>
            </div>
            <div class="arcade-btn" data-key="C">
                C
                <span class="sub-text">VÀNG</span>
            </div>
            <div class="arcade-btn" data-key="D">
                D
                <span class="sub-text">LỤC</span>
            </div>
        </div>

        <div class="control-group">
            <span class="dock-label">Nút Hành Động:</span>
            <div class="arcade-btn arcade-btn-enter" data-key="ENTER">
                ENTER
                <span class="sub-text">MỞ / LẮC / BỐC</span>
            </div>
        </div>
    </div>

    <div class="hint-text">
        Hỗ trợ song song: 5 nút bấm Arduino hoặc Bàn phím máy tính (A, B, C, D | ENTER/SPACE | Phím W: Thời tiết | Phím F: Toàn màn hình)
    </div>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/question_generator.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/cursor_fx.js"></script>
    <script src="js/game.js"></script>

    <!-- Quản lý cổng COM Arduino qua giao diện -->
    <script>
        // Cập nhật Pixel Icons cho các thành phần giao diện HTML
        function initHtmlPixelIcons() {
            if (!window.PixelSprites || !window.PixelSprites.getPixelIconDataUrl) return;

            // Icon cho Brand Title
            const brandIcon = document.getElementById('brandIcon');
            if (brandIcon) {
                brandIcon.src = window.PixelSprites.getPixelIconDataUrl('gamepad', 24);
            }

            // Icon cho nút Toàn màn hình
            const iconFs = document.getElementById('iconFs');
            if (iconFs) {
                iconFs.src = window.PixelSprites.getPixelIconDataUrl('star', 16);
            }

            updateWeatherButtonIcon(window.WeatherSystem ? window.WeatherSystem.currentType : 'SUNNY');
        }

        function updateWeatherButtonIcon(type) {
            if (!window.PixelSprites || !window.PixelSprites.getPixelIconDataUrl) return;
            const iconImg = document.getElementById('weatherIconImg');
            const label = document.getElementById('weatherLabel');
            if (!iconImg || !label) return;

            const map = {
                SUNNY: { icon: 'sun', text: 'Nắng' },
                RAIN: { icon: 'rain', text: 'Mưa' },
                SNOW: { icon: 'snow', text: 'Tuyết' }
            };
            const cur = map[type] || map.SUNNY;
            iconImg.src = window.PixelSprites.getPixelIconDataUrl(cur.icon, 16);
            label.innerText = cur.text;
        }

        // Toàn màn hình (FHD Fullscreen)
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    document.body.classList.add('is-fullscreen');
                }).catch(err => {
                    console.warn(`Lỗi mở toàn màn hình: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        document.body.classList.remove('is-fullscreen');
                    });
                }
            }
        }

        document.getElementById('btnFullscreen').addEventListener('click', toggleFullScreen);
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                document.body.classList.add('is-fullscreen');
            } else {
                document.body.classList.remove('is-fullscreen');
            }
        });

        async function loadPorts() {
            try {
                const res = await fetch('/api/ports');
                const data = await res.json();
                const select = document.getElementById('portSelect');
                select.innerHTML = '<option value="">Chọn cổng COM...</option>';
                data.ports.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.path;
                    opt.innerText = `${p.path} (${p.manufacturer || 'Thiết bị USB'})`;
                    select.appendChild(opt);
                });
                if (data.connectedPort) {
                    select.value = data.connectedPort;
                }
            } catch (e) {
                console.error("Lỗi lấy danh sách cổng COM:", e);
            }
        }

        document.getElementById('btnConnectPort').addEventListener('click', async () => {
            const port = document.getElementById('portSelect').value;
            if (!port) {
                alert("Vui lòng chọn một cổng COM từ danh sách!");
                return;
            }
            try {
                const res = await fetch('/api/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ port })
                });
                const data = await res.json();
                if (data.success) {
                    alert(`Đã kết nối thành công tới ${port}!`);
                } else {
                    alert(`Lỗi kết nối: ${data.error}`);
                }
            } catch (e) {
                alert("Không thể gửi yêu cầu kết nối tới server.");
            }
        });

        // Đổi thời tiết từ nút giao diện
        document.getElementById('btnWeather').addEventListener('click', () => {
            if (window.game) {
                const w = window.game.toggleWeather();
                updateWeatherButtonIcon(w);
            }
        });

        // Tải danh sách cổng lúc ban đầu
        loadPorts();
        setInterval(loadPorts, 5000);

        // Khởi tạo các pixel icons giao diện khi DOM sẵn sàng
        window.addEventListener('DOMContentLoaded', () => {
            initHtmlPixelIcons();
        });
        setTimeout(initHtmlPixelIcons, 100);

        // Hiệu ứng sáng nút khi nhấn phím & Phím F cho toàn màn hình
        window.addEventListener('keydown', (e) => {
            let k = e.key.toUpperCase();
            if (k === 'F' && !e.ctrlKey && !e.altKey && !e.metaKey) {
                toggleFullScreen();
                return;
            }
            if (k === ' ' || k === 'ENTER') k = 'ENTER';
            const btn = document.querySelector(`.arcade-btn[data-key="${k}"]`);
            if (btn) {
                btn.classList.add('active');
                setTimeout(() => btn.classList.remove('active'), 150);
            }
        });
    </script>
</body>
</html>
