name: Build macOS DMG & Multiplatform Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install create-dmg
        run: brew install create-dmg || true

      - name: Package macOS Apps (Apple Silicon & Intel)
        run: |
          npm run dist:mac

      - name: Build macOS DMG (Apple Silicon arm64)
        run: |
          mkdir -p dist
          if command -v create-dmg &> /dev/null; then
            create-dmg \
              --volname "CyberSec Password Guardian (Apple Silicon)" \
              --window-pos 200 120 \
              --window-size 660 400 \
              --icon-size 100 \
              --icon "CyberSecGame.app" 180 180 \
              --hide-extension "CyberSecGame.app" \
              --app-drop-link 480 180 \
              "dist/CyberSecGame-macOS-arm64.dmg" \
              "dist/CyberSecGame-darwin-arm64/CyberSecGame.app" || \
            hdiutil create -volname "CyberSec Password Guardian" \
              -srcfolder "dist/CyberSecGame-darwin-arm64/CyberSecGame.app" \
              -ov -format UDZO "dist/CyberSecGame-macOS-arm64.dmg"
          else
            hdiutil create -volname "CyberSec Password Guardian" \
              -srcfolder "dist/CyberSecGame-darwin-arm64/CyberSecGame.app" \
              -ov -format UDZO "dist/CyberSecGame-macOS-arm64.dmg"
          fi

      - name: Build macOS DMG (Intel x64)
        run: |
          if command -v create-dmg &> /dev/null; then
            create-dmg \
              --volname "CyberSec Password Guardian (Intel)" \
              --window-pos 200 120 \
              --window-size 660 400 \
              --icon-size 100 \
              --icon "CyberSecGame.app" 180 180 \
              --hide-extension "CyberSecGame.app" \
              --app-drop-link 480 180 \
              "dist/CyberSecGame-macOS-x64.dmg" \
              "dist/CyberSecGame-darwin-x64/CyberSecGame.app" || \
            hdiutil create -volname "CyberSec Password Guardian" \
              -srcfolder "dist/CyberSecGame-darwin-x64/CyberSecGame.app" \
              -ov -format UDZO "dist/CyberSecGame-macOS-x64.dmg"
          else
            hdiutil create -volname "CyberSec Password Guardian" \
              -srcfolder "dist/CyberSecGame-darwin-x64/CyberSecGame.app" \
              -ov -format UDZO "dist/CyberSecGame-macOS-x64.dmg"
          fi

      - name: Upload macOS DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG-Packages
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
